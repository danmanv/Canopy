name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Once the release key is in the repository's secrets, debug builds are signed with it too, so a PR's build and a
# release install over each other on the TV. Without it (or on a fork's PR) they use the committed debug key.
env:
  CANOPY_KEYSTORE_BASE64: ${{ secrets.CANOPY_KEYSTORE_BASE64 }}
  CANOPY_KEYSTORE_PASSWORD: ${{ secrets.CANOPY_KEYSTORE_PASSWORD }}
  CANOPY_KEY_ALIAS: ${{ secrets.CANOPY_KEY_ALIAS }}
  # Rotten Tomatoes scores (Ratings.kt); without it the apps show IMDb only.
  MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Release key
        if: env.CANOPY_KEYSTORE_BASE64 != ''
        run: |
          echo "$CANOPY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/canopy-release.jks"
          echo "CANOPY_KEYSTORE=$RUNNER_TEMP/canopy-release.jks" >> "$GITHUB_ENV"
          echo "KEY_FLAG=-PreleaseKey" >> "$GITHUB_ENV"
      # Proves the MDBList key works: the Rotten Tomatoes and IMDb scores for one film and one show (never the key).
      - name: Check Rotten Tomatoes scores
        if: env.MDBLIST_API_KEY != ''
        continue-on-error: true
        run: |
          for t in movie/tt0111161 show/tt0903747; do
            curl -s "https://api.mdblist.com/imdb/$t?apikey=$MDBLIST_API_KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); print('$t', d.get('title'), {r['source']: r.get('value') for r in d.get('ratings', []) if r['source'] in ('imdb','tomatoes','popcorn')})"
          done
          # Posters ask in batches of up to 100: check that answer's shape too.
          curl -s -X POST -H 'Content-Type: application/json' -d '{"ids":["tt0111161","tt0068646"]}' \
            "https://api.mdblist.com/imdb/movie/?apikey=$MDBLIST_API_KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(type(d).__name__, [(x.get('ids',{}).get('imdb'), {r['source']: r.get('value') for r in x.get('ratings', []) if r['source'] in ('imdb','tomatoes','popcorn')}) for x in (d if isinstance(d,list) else [d])][:3]); print(str(d)[:300] if not isinstance(d,list) else '')"
          curl -s -D - -o /dev/null "https://api.mdblist.com/imdb/movie/tt0111161?apikey=$MDBLIST_API_KEY" | grep -i 'ratelimit\|x-rate' || true
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Debug APK
        run: ./gradlew assembleDebug $KEY_FLAG
      - uses: actions/upload-artifact@v5
        with:
          name: Canopy-debug
          path: app/build/outputs/apk/debug/*.apk
      # The build to put on a TV: optimised and shrunk like the releases. A debug build runs noticeably slower (Android
      # skips most of its compiler work for a debuggable app), so it showed jank a release wouldn't have.
      - name: Fast APK
        run: ./gradlew assembleRelease $KEY_FLAG
      - uses: actions/upload-artifact@v5
        with:
          name: Canopy-fast
          path: app/build/outputs/apk/release/*.apk
